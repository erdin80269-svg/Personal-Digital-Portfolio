/* ====== 状态 ====== */
let lang = new URLSearchParams(location.search).get("lang")
        || localStorage.getItem("resume_lang") || "cn";
if (lang !== "en") lang = "cn";
let currentCard = null;

const $ = s => document.querySelector(s);
const stage=$("#stage"), frame=$("#frame"), imgMain=$("#imgMain"), imgHover=$("#imgHover");
const modal=$("#modal"), sheet=$("#sheet"), langBtn=$("#langBtn");
const intro=$("#intro"), introVideo=$("#introVideo"), skipBtn=$("#skipBtn");

/* ====== 预加载（只加载当前语言 + 真实进度条，另一语言后台预载） ====== */
let loadedN = 0, totalN = 1;
function progress(){
  loadedN++;
  const pct = Math.min(96, Math.round(loadedN / totalN * 100));
  const bar = document.querySelector("#loader .bar i");
  if (bar) bar.style.width = pct + "%";
  const txt = document.querySelector("#loadTxt");
  if (txt) txt.textContent = CONTENT[lang].loadTxt + " " + pct + "%";
}
function loadImg(u){ return new Promise(res=>{ const im=new Image();
  im.onload=()=>{progress();res();}; im.onerror=()=>{progress();res();}; im.src=u; }); }
function loadVideo(u){ return new Promise(res=>{ const v=document.createElement("video");
  v.preload="auto"; v.oncanplaythrough=()=>{progress();res();}; v.onerror=()=>{progress();res();};
  v.src=u; setTimeout(()=>{progress();res();}, 9000); }); }
function preload(){
  const list = [IMG[lang].main, ...IMG[lang].e];
  totalN = list.length + 1; loadedN = 0;
  return Promise.all(list.map(loadImg)).then(()=> loadVideo(VIDEO[lang]));
}
function preloadOther(){
  const o = lang==="cn" ? "en" : "cn";
  [IMG[o].main, ...IMG[o].e].forEach(u=>{ const im=new Image(); im.src=u; });
  if (VIDEO[o]) { const v=document.createElement("video"); v.preload="auto"; v.src=VIDEO[o]; }
}

/* ====== 语言切换 ====== */
function applyLang(){
  document.documentElement.lang = lang==="cn" ? "zh-CN" : "en";
  imgMain.src = IMG[lang].main;
  imgHover.classList.remove("on");
  langBtn.querySelector("span").textContent = lang==="cn" ? "EN" : "中文";
  skipBtn.textContent = CONTENT[lang].skip;
  $("#loadTxt").textContent = CONTENT[lang].loadTxt;
  buildHotspots();
  if (currentCard !== null) openModal(currentCard, true);
  localStorage.setItem("resume_lang", lang);
}
langBtn.addEventListener("click", ()=>{ lang = lang==="cn" ? "en" : "cn"; applyLang(); });

/* ====== 热区 ====== */
function buildHotspots(){
  frame.querySelectorAll(".hotspot").forEach(el=>el.remove());
  for (const h of HOTSPOTS[lang]) {
    const d=document.createElement("div");
    d.className="hotspot";
    d.style.clipPath = "polygon(" + h.pts_pct.map(p=>p[0]+"% "+p[1]+"%").join(",") + ")";
    d.addEventListener("mouseenter", ()=>{ imgHover.src = IMG[lang].e[h.n-1]; imgHover.classList.add("on"); });
    d.addEventListener("mouseleave", ()=> imgHover.classList.remove("on"));
    d.addEventListener("click", ()=> openModal(h.n));
    frame.appendChild(d);
  }
  const bar=document.createElement("div");
  bar.className="hotspot";
  bar.style.clipPath="polygon(1.5% 92.5%, 98.5% 92.5%, 98.5% 98.6%, 1.5% 98.6%)";
  bar.addEventListener("click", ()=> openModal("contact"));
  frame.appendChild(bar);
}

/* ====== 弹窗 ====== */
function openModal(card, keep){
  currentCard = card;
  const c = card==="contact" ? CONTENT[lang].contact : CONTENT[lang].cards[card];
  let html = `<div class="mHead"><span class="badge">${c.num}</span>
    <div><div class="mTitle">${c.title}</div><div class="mSub">${c.sub}</div></div></div>
    <button class="mClose" aria-label="close">✕</button>`;
  for (const s of (c.sections||[])) {
    html += `<div class="sec"><h4>${s.h}</h4><ul>${s.items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`;
  }
  if (c.ip) html += `<div class="ipBox"><h4>${c.ip.title}</h4><p>${c.ip.text}</p></div>`;
  if (c.links) html += `<div class="sec links">` + c.links.map(l=>`<a href="${l.href}" target="_blank" rel="noopener">${l.icon} ${l.label}</a>`).join("") + `</div>`;
  html += `<div class="barcode"></div>`;
  sheet.innerHTML = html;
  sheet.querySelector(".mClose").addEventListener("click", closeModal);
  modal.classList.add("show");
}
function closeModal(){ modal.classList.remove("show"); currentCard=null; }
modal.addEventListener("click", e=>{ if(e.target===modal) closeModal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

/* ====== 开场：视频或 CSS 动画 ====== */
function startIntro(){
  setTimeout(preloadOther, 2500);   // 首屏出来后，后台预载另一语言素材
  if (VIDEO[lang]) {
    introVideo.src = VIDEO[lang];
    intro.classList.add("show");
    introVideo.play().catch(()=>{});
    const end = ()=> finishIntro();
    introVideo.addEventListener("ended", end, { once:true });
    skipBtn.addEventListener("click", end, { once:true });
  } else {
    stage.classList.add("entrance");
  }
}
function finishIntro(){
  intro.classList.add("fade");
  stage.classList.add("entrance");
  setTimeout(()=> intro.remove(), 700);
}

/* ====== 启动 ====== */
applyLang();
preload().then(()=>{
  $("#loader").classList.add("done");
  setTimeout(startIntro, 250);
});
</script>
</body>
</html>
